spring:
  application:
    name: slinsight
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slinsight}
    username: ${DB_USERNAME:slinsight}
    password: ${DB_PASSWORD:slinsight_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.lock.timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  sql:
    init:
      mode: never
  web:
    error:
      include-stacktrace: never
      include-exception: false
      include-message: never
      include-binding-errors: never